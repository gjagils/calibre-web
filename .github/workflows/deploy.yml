name: Build and Deploy

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  # Wekelijks opnieuw bouwen, zodat security-rebuilds van linuxserver (zelfde versie) meekomen
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Deploy-stappen draaien alleen als de Portainer-stack al bestaat
      HAS_STACK: ${{ secrets.PORTAINER_STACK_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Connect to Tailscale
        if: env.HAS_STACK != ''
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy via Portainer API
        if: env.HAS_STACK != ''
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_TOKEN: ${{ secrets.PORTAINER_API_TOKEN }}
          PORTAINER_STACK_ID: ${{ secrets.PORTAINER_STACK_ID }}
          WANT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # Haal huidige stack info op
          STACK_INFO=$(curl -s -H "X-API-Key: $PORTAINER_API_TOKEN" \
            "$PORTAINER_URL/api/stacks/$PORTAINER_STACK_ID")
          ENDPOINT_ID=$(echo "$STACK_INFO" | jq -r '.EndpointId')
          CURRENT_ENV=$(echo "$STACK_INFO" | jq '.Env // []')

          # Pull het zojuist gebouwde image op de Synology. ghcr serveert soms nog even het
          # oude image na een push, daarom net zo lang pullen tot de digest klopt.
          IMAGE_LOWER=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          for i in 1 2 3 4 5 6; do
            curl -s -X POST \
              -H "X-API-Key: $PORTAINER_API_TOKEN" \
              "$PORTAINER_URL/api/endpoints/$ENDPOINT_ID/docker/images/create?fromImage=ghcr.io%2F${IMAGE_LOWER}&tag=latest" > /dev/null
            HAVE=$(curl -s -H "X-API-Key: $PORTAINER_API_TOKEN" \
              "$PORTAINER_URL/api/endpoints/$ENDPOINT_ID/docker/images/ghcr.io%2F${IMAGE_LOWER}:latest/json" \
              | jq -r '.RepoDigests[]' | cut -d@ -f2)
            if echo "$HAVE" | grep -q "$WANT_DIGEST"; then echo "Image met juiste digest aanwezig."; break; fi
            echo "Digest nog niet gelijk (poging $i), 15s wachten..."; sleep 15
          done
          echo "$HAVE" | grep -q "$WANT_DIGEST" || { echo "Nieuw image niet binnengekregen op Synology"; exit 1; }

          # Merge env vars: behoud bestaande, overschrijf met nieuwe
          MERGED_ENV="$CURRENT_ENV"

          # Redeploy stack
          STACK_FILE=$(cat docker-compose.yml)
          curl -s -X PUT \
            -H "X-API-Key: $PORTAINER_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"StackFileContent\": $(echo "$STACK_FILE" | jq -Rs .),
              \"Env\": $MERGED_ENV,
              \"Prune\": true
            }" \
            "$PORTAINER_URL/api/stacks/$PORTAINER_STACK_ID?endpointId=$ENDPOINT_ID" \
            | jq '{Id, Name, Status, message}'   # nooit de volledige stack loggen: die bevat de env-secrets
          echo "Deploy complete."

      - name: Oude images opruimen op Synology
        # Na een deploy blijven oude versies achter: ongetagd, of met een eigen tag per commit.
        # Ongetagde images gaan direct weg, ongebruikte getagde images na 7 dagen.
        # Raakt geen images die een container (ook een gestopte) gebruikt, en een fout hier laat de deploy niet falen.
        continue-on-error: true
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_TOKEN: ${{ secrets.PORTAINER_API_TOKEN }}
          PORTAINER_STACK_ID: ${{ secrets.PORTAINER_STACK_ID }}
        run: |
          [ -n "$PORTAINER_STACK_ID" ] || { echo "Geen stack, niets op te ruimen."; exit 0; }
          ENDPOINT_ID=$(curl -s -H "X-API-Key: $PORTAINER_API_TOKEN" \
            "$PORTAINER_URL/api/stacks/$PORTAINER_STACK_ID" | jq -r '.EndpointId')
          prune() {
            curl -s -m 300 -X POST -H "X-API-Key: $PORTAINER_API_TOKEN" \
              "$PORTAINER_URL/api/endpoints/$ENDPOINT_ID/docker/images/prune?filters=$1" \
              | jq '{verwijderd: ((.ImagesDeleted // []) | length), vrijgemaakt_MB: ((.SpaceReclaimed // 0) / 1000000 | floor), message}'
          }
          prune '%7B%22dangling%22%3A%5B%22true%22%5D%7D'
          prune '%7B%22dangling%22%3A%5B%22false%22%5D%2C%22until%22%3A%5B%22168h%22%5D%7D'
